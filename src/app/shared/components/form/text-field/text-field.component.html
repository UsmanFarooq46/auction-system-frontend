<div class="space-y-1">
  @if (label) {
    <label class="block text-sm font-medium text-gray-700">{{ label }}</label>
  }
  <input
    [type]="type"
    class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200"
    [class.border-gray-300]="!invalid"
    [class.border-red-500]="invalid"
    [attr.placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value ?? ''"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  @if (invalid && error) {
    <p class="text-red-500 text-sm">{{ error }}</p>
  }
</div>

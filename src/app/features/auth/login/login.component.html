<!-- Login Page Container -->
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Header Section -->
    <div class="text-center">
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
          <span class="text-white text-2xl font-bold">🏆</span>
        </div>
      </div>
      <h2 class="text-4xl font-bold text-gray-900 mb-2">Welcome Back!</h2>
      <p class="text-lg text-gray-600">Sign in to your AuctionHub account</p>
    </div>

    <!-- Login Form Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <app-text-field
            label="Email Address"
            type="email"
            placeholder="Enter your email"
            [invalid]="(loginForm.get('email')?.invalid ?? false) && (loginForm.get('email')?.touched ?? false)"
            [error]="(loginForm.get('email')?.invalid ?? false) && (loginForm.get('email')?.touched ?? false) ? 'Please enter a valid email address' : ''"
            formControlName="email">
          </app-text-field>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <app-text-field
            label="Password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Enter your password"
            [invalid]="(loginForm.get('password')?.invalid ?? false) && (loginForm.get('password')?.touched ?? false)"
            [error]="(loginForm.get('password')?.invalid ?? false) && (loginForm.get('password')?.touched ?? false) ? 'Password must be at least 6 characters' : ''"
            formControlName="password">
          </app-text-field>
          <div class="flex justify-end">
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="text-sm text-gray-500 hover:text-gray-700 transition-colors"
            >
              {{ showPassword() ? 'Hide password' : 'Show password' }}
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input
              id="remember-me"
              type="checkbox"
              formControlName="rememberMe"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
            <label for="remember-me" class="ml-2 block text-sm text-gray-700">
              Remember me
            </label>
          </div>
          <button
            type="button"
            (click)="forgotPassword()"
            class="text-sm text-blue-600 hover:text-blue-500 font-medium transition-colors"
          >
            Forgot password?
          </button>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading()"
          class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform hover:scale-105"
        >
          @if (isLoading()) {
            <div class="flex items-center">
              <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
              Signing in...
            </div>
          } @else {
            <div class="flex items-center">
              <span class="mr-2">🚀</span>
              Sign In
            </div>
          }
        </button>

        <!-- Error Message -->
        @if (errorMessage()) {
          <div class="bg-red-50 border border-red-200 rounded-xl p-4">
            <div class="flex items-center">
              <span class="text-red-400 mr-2">❌</span>
              <p class="text-red-700 text-sm">{{ errorMessage() }}</p>
            </div>
          </div>
        }
      </form>

      <!-- Divider -->
      <div class="mt-8">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">Or continue with</span>
          </div>
        </div>
      </div>

      <!-- Social Login Buttons -->
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button
          type="button"
          (click)="loginWithGoogle()"
          class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-xl shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 transition-all duration-200 transform hover:scale-105"
        >
          <span class="mr-2">🔍</span>
          Google
        </button>
        <button
          type="button"
          (click)="loginWithFacebook()"
          class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-xl shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 transition-all duration-200 transform hover:scale-105"
        >
          <span class="mr-2">📘</span>
          Facebook
        </button>
      </div>
    </div>

    <!-- Sign Up Link -->
    <div class="text-center">
      <p class="text-gray-600">
        Don't have an account?
        <a
          routerLink="/auth/register"
          class="font-semibold text-blue-600 hover:text-blue-500 transition-colors"
        >
          Sign up for free
        </a>
      </p>
    </div>

    <!-- Back to Home -->
    <div class="text-center">
      <a
        routerLink="/"
        class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 transition-colors"
      >
        <span class="mr-1">←</span>
        Back to home
      </a>
    </div>
  </div>
</div>

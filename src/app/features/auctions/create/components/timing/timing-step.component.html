<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6" [formGroup]="form">
  <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center">
    <svg class="w-6 h-6 text-purple-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    Auction Timing
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Duration -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Duration *</label>
      <select 
        formControlName="duration"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
        [class.border-red-500]="form.get('duration')?.invalid && form.get('duration')?.touched">
        <option value="">Select duration</option>
        @for (duration of durations; track duration.value) {
          <option [value]="duration.value">{{ duration.label }}</option>
        }
      </select>
      @if (getFieldError('duration')) {
      <p class="text-red-500 text-sm mt-1">{{ getFieldError('duration') }}</p>
      }
    </div>

    <!-- Start Date -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Start Date *</label>
      <input 
        type="datetime-local" 
        formControlName="startDate"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
        [class.border-red-500]="form.get('startDate')?.invalid && form.get('startDate')?.touched">
      @if (getFieldError('startDate')) {
      <p class="text-red-500 text-sm mt-1">{{ getFieldError('startDate') }}</p>
      }
    </div>

    <!-- End Date -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">End Date *</label>
      <input 
        type="datetime-local" 
        formControlName="endDate"
        readonly
        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 text-gray-600">
      <p class="text-gray-500 text-sm mt-1">Automatically calculated</p>
    </div>
  </div>
</div>

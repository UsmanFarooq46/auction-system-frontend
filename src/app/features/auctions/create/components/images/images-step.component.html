<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
  <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center">
    <svg class="w-6 h-6 text-indigo-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
    </svg>
    Images
  </h2>

  <!-- Upload Area -->
  <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition-colors">
    <input 
      type="file" 
      multiple 
      accept="image/*"
      (change)="onSelect($event)"
      class="hidden"
      id="imageUpload">
    <label for="imageUpload" class="cursor-pointer">
      <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <p class="text-lg font-medium text-gray-700 mb-2">Upload Images</p>
      <p class="text-gray-500">Click to browse or drag and drop</p>
      <p class="text-sm text-gray-400 mt-2">PNG, JPG, GIF up to 10MB each (max 10 images)</p>
    </label>
  </div>

  <!-- Image Previews -->
  @if (previewImages.length > 0) {
  <div class="mt-6">
    <h3 class="text-lg font-medium text-gray-900 mb-4">Selected Images ({{ previewImages.length }}/10)</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
      @for (preview of previewImages; track preview; let i = $index) {
      <div class="relative group">
        <img [src]="preview" alt="Preview" class="w-full h-32 object-cover rounded-lg">
        <button 
          type="button"
          (click)="onRemove(i)"
          class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      }
    </div>
  </div>
  }
</div>

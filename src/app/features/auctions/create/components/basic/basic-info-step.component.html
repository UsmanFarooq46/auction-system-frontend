<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
  <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center">
    <svg class="w-6 h-6 text-blue-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    Basic Information
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6" [formGroup]="form">
    <div class="md:col-span-2">
      <app-text-field label="Title" type="text" placeholder="Enter your title"
        [invalid]="(form.get('title')?.invalid ?? false) && (form.get('title')?.touched ?? false)"
        [error]="(form.get('title')?.invalid ?? false) && (form.get('title')?.touched ?? false) ? 'Please enter title' : ''"
        formControlName="title">
      </app-text-field>
    </div>

    <div>
      <app-select-box label="Category *" placeholder="Select a category" [options]="defaultCategories"
        [invalid]="(form.get('category')?.invalid ?? false) && (form.get('category')?.touched ?? false)"
        [error]="getFieldError('category')" formControlName="category">
      </app-select-box>
    </div>

    <div>
      <app-select-box label="Condition *" placeholder="Select a condition" [options]="conditions"
        [invalid]="(form.get('condition')?.invalid ?? false) && (form.get('condition')?.touched ?? false)"
        [error]="getFieldError('condition')" formControlName="condition">
      </app-select-box>
    </div>

    <div class="md:col-span-2">
      <app-textarea-field
        label="Description *"
        placeholder="Provide detailed information about your item..."
        [rows]="6"
        [invalid]="(form.get('description')?.invalid ?? false) && (form.get('description')?.touched ?? false)"
        [error]="getFieldError('description')"
        formControlName="description">
      </app-textarea-field>
      <p class="text-gray-500 text-sm mt-1">{{ form.get('description')?.value?.length || 0 }}/1000 characters</p>
    </div>

  </div>
</div>

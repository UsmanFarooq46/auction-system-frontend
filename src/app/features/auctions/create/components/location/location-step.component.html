<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6" [formGroup]="form">
  <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center">
    <svg class="w-6 h-6 text-orange-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>
    Location
  </h2>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Item Location *</label>
    <input 
      type="text" 
      formControlName="location"
      placeholder="Enter city, province, Pakistan"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
      [class.border-red-500]="form.get('location')?.invalid && form.get('location')?.touched">
    @if (getFieldError('location')) {
    <p class="text-red-500 text-sm mt-1">{{ getFieldError('location') }}</p>
    }
  </div>
</div>

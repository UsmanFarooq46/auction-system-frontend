<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6" [formGroup]="form">
  <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center">
    <svg class="w-6 h-6 text-green-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
    </svg>
    Pricing
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Starting Price -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Starting Price (PKR) *</label>
      <div class="relative">
        <input 
          type="number" 
          formControlName="startingPrice"
          placeholder="0"
          min="1"
          class="w-full px-4 py-3 pl-8 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
          [class.border-red-500]="form.get('startingPrice')?.invalid && form.get('startingPrice')?.touched">
        <span class="absolute left-3 top-3 text-gray-500">₨</span>
      </div>
      @if (getFieldError('startingPrice')) {
      <p class="text-red-500 text-sm mt-1">{{ getFieldError('startingPrice') }}</p>
      }
    </div>

    <!-- Reserve Price -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Reserve Price (PKR)</label>
      <div class="relative">
        <input 
          type="number" 
          formControlName="reservePrice"
          placeholder="0"
          min="1"
          class="w-full px-4 py-3 pl-8 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
        <span class="absolute left-3 top-3 text-gray-500">₨</span>
      </div>
      <p class="text-gray-500 text-sm mt-1">Optional: Minimum price you're willing to accept</p>
    </div>
  </div>
</div>

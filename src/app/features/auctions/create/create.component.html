<div class="min-h-screen bg-gray-50 py-8">
  <div class="container mx-auto px-4 max-w-6xl">
    <!-- Header -->
    <div class="mb-8">
      <!-- Breadcrumb -->
      <div class="flex items-center justify-between mb-4">
        <nav class="text-sm text-gray-500" aria-label="Breadcrumb">
          <ol class="flex items-center space-x-2">
            <li>
              <button (click)="goBack()" class="inline-flex items-center hover:text-gray-700">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Auctions
              </button>
            </li>
            <li class="text-gray-400">/</li>
            <li class="text-gray-700 font-medium">Create</li>
          </ol>
        </nav>
      </div>

      <!-- Title block -->
      <div class="bg-gradient-to-r from-indigo-50 to-blue-50 rounded-xl border border-indigo-100 p-6">
        <div class="flex items-start gap-4">
          <div class="shrink-0">
            <div class="w-10 h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1">
                </path>
              </svg>
            </div>
          </div>
          <div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Create New Auction</h1>
            <p class="text-gray-600 mt-1">Provide details, set pricing, and get your listing live.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Form -->
      <div class="lg:col-span-2">
        <app-auction-form 
          (formSubmitted)="onFormSubmitted($event)">
        </app-auction-form>
      </div>
    </div>
  </div>
</div>

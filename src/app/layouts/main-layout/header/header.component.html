<header class="bg-white shadow-md border-b border-gray-200 sticky top-0 z-40">
  <div class="container">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <div class="logo flex items-center space-x-2">
        <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-yellow-500 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-lg">🏆</span>
        </div>
        <h1 class="text-heading-4 text-gradient">AuctionHub</h1>
      </div>

      <!-- Navigation -->
      <nav class="hidden md:flex items-center space-x-1">
        <a routerLink="/auctions"
           class="nav-link flex items-center space-x-2 px-4 py-2 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all duration-200">
          <span>🔨</span>
          <span>Auctions</span>
        </a>
        <a routerLink="/bids"
           class="nav-link flex items-center space-x-2 px-4 py-2 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all duration-200">
          <span>📋</span>
          <span>My Bids</span>
        </a>
        <a routerLink="/users/profile"
           class="nav-link flex items-center space-x-2 px-4 py-2 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all duration-200">
          <span>👤</span>
          <span>Profile</span>
        </a>
      </nav>

      <!-- User Menu -->
      @if (currentUser()) {
        <div class="flex items-center space-x-4">
          <div class="hidden sm:flex items-center space-x-2 px-3 py-2 bg-gray-50 rounded-lg">
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
              <span class="text-white font-medium text-sm">{{ currentUser()?.firstName?.charAt(0) }}</span>
            </div>
            <span class="text-label">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</span>
          </div>
          <button (click)="logout()"
                  class="btn btn-outline btn-sm">
            <span>🚪</span>
            <span>Logout</span>
          </button>
        </div>
      } @else {
        <div class="flex items-center space-x-3">
          <a routerLink="/register"
             class="btn btn-ghost btn-sm">
            <span>📝</span>
            <span>Sign Up</span>
          </a>
          <a routerLink="/auth/login"
             class="btn btn-primary btn-sm">
            <span>🔑</span>
            <span>Login</span>
          </a>
        </div>
      }
    </div>
  </div>
</header>
